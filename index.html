    <div class="content">
        <!-- Daily View -->
        <div id="dailyView" class="view-section">

        <!-- Setup View -->
        <div id="setupView" class="view-section setup-section">
            <div class="form-group">
                <label class="form-label">Create New Category</label>
                <input type="text" class="form-input" id="newCategoryInput" placeholder="Enter category name (e.g., Health, Finance)">
                <input type="text" class="form-input" id="newCategoryIcon" placeholder="Enter emoji (e.g., 💪, 💰)" style="margin-top: 8px;">
                <button class="add-btn" onclick="addCategory()">Add Category</button>
            </div>

            <div class="form-group">
                <label class="form-label">Add New Task</label>
                <input type="text" class="form-input" id="newTaskInput" placeholder="Enter task description">
                <select class="form-input" id="taskCategory" style="margin-top: 8px;">
                    <option value="comms">Communications</option>
                    <option value="learning">Learning</option>
                    <option value="construction">Construction</option>
                </select>
                <select class="form-input" id="taskType" style="margin-top: 8px;">

                    <option value="daily">Daily</option>

                    <option value="weekends">Weekends</option>
                    <option value="monday">Mondays only</option>

<script>
    // Category definitions with icons and colors
    let categories = {
        comms: { name: 'Communications', icon: '📧', color: '#ff6b6b' },
        learning: { name: 'Learning', icon: '📚', color: '#4ecdc4' },
        construction: { name: 'Construction', icon: '🔨', color: '#45b7d1' }
    };

    // Sample data structure
    let tasks = {
        comms: [
            { id: 1, text: "Clear email inbox", type: "weekdays" },
            { id: 2, text: "Upload photos to Nixplay", type: "sunday" },
            { id: 3, text: "Call insurance about claim", type: "never" }
        ],
        learning: [
            { id: 4, text: "Read BBC News", type: "wednesday" },
            { id: 5, text: "Check music blog - Pitchfork", type: "friday" },
            { id: 6, text: "Review Twitter account @interesting", type: "monthly" },
            { id: 7, text: "Research meditation apps", type: "never" }
        ],
        construction: [
            { id: 8, text: "Research kitchen cabinet handles", type: "saturday" },
            { id: 9, text: "Call contractor about timeline", type: "thursday" },
            { id: 10, text: "Pick paint colors for bedroom", type: "weekend" }
        ]
    };

    let rules = {
        comms: { 
            monday: 1, tuesday: 1, wednesday: 0, thursday: 1, friday: 1, saturday: 0, sunday: 0 
        },
        learning: { 
            monday: 1, tuesday: 1, wednesday: 2, thursday: 1, friday: 1, saturday: 1, sunday: 1 
        },
        construction: { 
            monday: 0, tuesday: 0, wednesday: 0, thursday: 1, friday: 0, saturday: 2, sunday: 1 
        }
    };

    let rotationIndex = {
        comms: 0,
        learning: 0,
        construction: 0
    };

    function getCurrentDate() {
        const today = new Date();
        const options = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        };
        return today.toLocaleDateString('en-US', options);
    }

    function isWeekend() {
        const today = new Date();
        const day = today.getDay();
        return day === 0 || day === 6; // Sunday or Saturday
    }

    function shouldTaskAppearToday(task) {
        const today = new Date();
        const dayOfWeek = today.getDay(); // 0 = Sunday, 1 = Monday, etc.
        const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
        const isWeekday = !isWeekend;
        
        const dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        const todayName = dayNames[dayOfWeek];
        
        switch (task.type) {
            case 'never':
                return false;
            case 'daily':
                return true;
            case 'weekdays':
                return isWeekday;
            case 'weekends':
                return isWeekend;
            case 'monday':
            case 'tuesday':
            case 'wednesday':
            case 'thursday':
            case 'friday':
            case 'saturday':
            case 'sunday':
                return task.type === todayName;
            case 'weekly':
            case 'biweekly':
            case 'monthly':
            case 'quarterly':
            case 'biannual':
            case 'yearly':
                // For demo purposes, we'll show these occasionally
                // In a real app, you'd track last completion dates
                return Math.random() > 0.7; // 30% chance to appear
            default:
                return false;
        }
    }

    function getCurrentDayName() {
        const today = new Date();
        const dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        return dayNames[today.getDay()];
    }

    function generateDailyTasks() {
        const currentDay = getCurrentDayName();
        const dailyTasks = {};

        for (const [category, categoryTasks] of Object.entries(tasks)) {
            dailyTasks[category] = [];
            const limit = rules[category][currentDay] || 0;
            
            if (limit > 0 && categoryTasks.length > 0) {
                // Get tasks that should appear today based on frequency
                const availableTasks = categoryTasks.filter(task => shouldTaskAppearToday(task));
                
                // Take up to the limit, rotating through available tasks
                for (let i = 0; i < Math.min(limit, availableTasks.length); i++) {
                    const taskIndex = (rotationIndex[category] + i) % availableTasks.length;
                    if (availableTasks[taskIndex]) {
                        dailyTasks[category].push(availableTasks[taskIndex]);
                    }
                }
                
                if (availableTasks.length > 0) {
                    rotationIndex[category] = (rotationIndex[category] + limit) % availableTasks.length;
                }
            }
        }

        return dailyTasks;
    }

    function generateRandomColor() {
        const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dda0dd', '#98d8c8', '#f7dc6f', '#bb8fce', '#85c1e9'];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    function addCategory() {
        const name = document.getElementById('newCategoryInput').value.trim();
        const icon = document.getElementById('newCategoryIcon').value.trim() || '📋';
        
        if (name) {
            const categoryId = name.toLowerCase().replace(/\s+/g, '');
            
            // Add to categories
            categories[categoryId] = {
                name: name,
                icon: icon,
                color: generateRandomColor()
            };
            
            // Initialize empty task list
            tasks[categoryId] = [];
            
            // Initialize rules for new categories
            rules[categoryId] = { 
                monday: 1, tuesday: 1, wednesday: 1, thursday: 1, 
                friday: 1, saturday: 1, sunday: 1 
            };
            
            // Initialize rotation index
            rotationIndex[categoryId] = 0;
            
            // Clear inputs
            document.getElementById('newCategoryInput').value = '';
            document.getElementById('newCategoryIcon').value = '';
            
            // Refresh the interface
            updateCategoryDropdown();
            renderDailyView();
            renderLimitsSection();
            
            // Show confirmation
            const btn = event.target;
            btn.textContent = 'Added!';
            btn.style.background = '#28a745';
            setTimeout(() => {
                btn.textContent = 'Add Category';
                btn.style.background = '#28a745';
            }, 1500);
        }
    }

    function updateCategoryDropdown() {
        const dropdown = document.getElementById('taskCategory');
        dropdown.innerHTML = '';
        
        for (const [categoryId, category] of Object.entries(categories)) {
            const option = document.createElement('option');
            option.value = categoryId;
            option.textContent = category.name;
            dropdown.appendChild(option);
        }
    }

    function renderDailyView() {
        const dailyViewContent = document.getElementById('dailyView');
        const dailyTasks = generateDailyTasks();
        
        // Clear existing content
        dailyViewContent.innerHTML = '';
        
        // Add each category section
        for (const [categoryId, category] of Object.entries(categories)) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'task-section';
            
            sectionDiv.innerHTML = `
                <div class="section-header">
                    <div class="section-icon" style="background: ${category.color}">${category.icon}</div>
                    <div class="section-title">${category.name}</div>
                </div>
                <div id="${categoryId}Tasks"></div>
            `;
            
            dailyViewContent.appendChild(sectionDiv);
            
            // Render tasks for this category
            const container = document.getElementById(`${categoryId}Tasks`);
            const categoryTasks = dailyTasks[categoryId] || [];
            
            if (categoryTasks.length === 0) {
                container.innerHTML = '<div class="task-item" style="opacity: 0.6; font-style: italic;">No tasks today - you\'re good!</div>';
            } else {
                categoryTasks.forEach(task => {
                    const taskElement = document.createElement('div');
                    taskElement.className = `task-item`;
                    taskElement.style.borderLeftColor = category.color;
                    taskElement.innerHTML = `
                        <div class="task-text">${task.text}</div>
                        <div class="task-meta">
                            <span class="task-type">${task.type}</span>
                            <button class="complete-btn" onclick="completeTask(${task.id})">Done</button>
                        </div>
                    `;
                    container.appendChild(taskElement);
                });
            }
        }
        
        // Add stats
        const statsDiv = document.createElement('div');
        statsDiv.className = 'stats';
        statsDiv.innerHTML = '<div class="stats-text">Perfect! Today\'s list respects your limits and helps you make progress.</div>';
        dailyViewContent.appendChild(statsDiv);
    }

    function renderLimitsSection() {
        const limitsContainer = document.querySelector('.task-section');
        if (!limitsContainer) return;
        
        let limitsHTML = '<div class="section-title" style="margin-bottom: 15px;">Daily Limits by Day</div>';
        
        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
        const dayKeys = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
        
        for (const [categoryId, category] of Object.entries(categories)) {
            limitsHTML += `
                <div class="form-group">
                    <label class="form-label">${category.name} Tasks</label>
            `;
            
            for (let i = 0; i < days.length; i++) {
                const dayKey = dayKeys[i];
                const dayName = days[i];
                limitsHTML += `
                    <div style="display: flex; gap: 10px; margin-bottom: 8px; align-items: center;">
                        <div style="width: 80px; font-size: 13px; color: #666;">${dayName}</div>
                        <div style="flex: 1;">
                            <input type="number" class="form-input" id="${categoryId}${dayKey}" min="0" max="10" value="${rules[categoryId][dayKey]}" style="padding: 8px;">
                        </div>
                    </div>
                `;
            }
            
            limitsHTML += '</div>';
        }
        
        limitsHTML += '<button class="add-btn" onclick="updateLimits()">Update Limits</button>';
        
        // Find the limits section and update it
        const setupView = document.getElementById('setupView');
        const existingLimits = setupView.querySelector('.task-section');
        if (existingLimits) {
            existingLimits.innerHTML = limitsHTML;
        }
    }

    function renderDailyTasks() {
        renderDailyView();
    }

    function renderTaskList() {
        const container = document.getElementById('taskList');
        container.innerHTML = '';

        for (const [category, categoryTasks] of Object.entries(tasks)) {
            categoryTasks.forEach(task => {
                const taskElement = document.createElement('div');
                taskElement.className = 'task-list-item';
                taskElement.innerHTML = `
                    <span>${task.text} (${category}, ${task.type})</span>
                    <button class="delete-btn" onclick="deleteTask('${category}', ${task.id})">Delete</button>
                `;
                container.appendChild(taskElement);
            });
        }
    }

    function addTask() {
        const text = document.getElementById('newTaskInput').value.trim();
        const category = document.getElementById('taskCategory').value;
        const type = document.getElementById('taskType').value;

        if (text) {
            const newTask = {
                id: Date.now(),
                text: text,
                type: type
            };
            
            tasks[category].push(newTask);
            document.getElementById('newTaskInput').value = '';
            renderTaskList();
        }
    }

    function deleteTask(category, taskId) {
        tasks[category] = tasks[category].filter(task => task.id !== taskId);
        renderTaskList();
        renderDailyTasks();
    }

    function completeTask(taskId) {
        // In a real app, this would mark the task as completed
        // For now, we'll just show a simple animation
        event.target.textContent = '✓';
        event.target.style.background = '#28a745';
        setTimeout(() => {
            renderDailyTasks();
        }, 1000);
    }

    function updateLimits() {
        const dayKeys = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
        
        for (const categoryId of Object.keys(categories)) {
            for (const dayKey of dayKeys) {
                const input = document.getElementById(`${categoryId}${dayKey}`);
                if (input) {
                    rules[categoryId][dayKey] = parseInt(input.value) || 0;
                }
            }
        }
        
        // Show confirmation
        const btn = event.target;
        btn.textContent = 'Updated!';
        btn.style.background = '#28a745';
        setTimeout(() => {
            btn.textContent = 'Update Limits';
            btn.style.background = '#28a745';
        }, 1500);
    }

    function loadLimitsIntoForm() {
        const dayKeys = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
        
        for (const categoryId of Object.keys(categories)) {
            for (const dayKey of dayKeys) {
                const input = document.getElementById(`${categoryId}${dayKey}`);
                if (input && rules[categoryId] && rules[categoryId][dayKey] !== undefined) {
                    input.value = rules[categoryId][dayKey];
                }
            }
        }
    }

    function showView(viewName) {
        document.querySelectorAll('.view-section').forEach(section => {
            section.style.display = 'none';
        });
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        if (viewName === 'daily') {
            document.getElementById('dailyView').style.display = 'block';
            event.target.classList.add('active');
            renderDailyTasks();
        } else if (viewName === 'setup') {
            document.getElementById('setupView').style.display = 'block';
            document.getElementById('setupView').classList.add('active');
            event.target.classList.add('active');
            updateCategoryDropdown();
            renderTaskList();
            renderLimitsSection();
            loadLimitsIntoForm();
        }
    }

    // Initialize the app
    document.getElementById('currentDate').textContent = getCurrentDate();
    updateCategoryDropdown();
    renderDailyTasks();

    // Allow Enter key to add tasks
    document.getElementById('newTaskInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addTask();
        }
    });
</script>
