    function getCurrentDate() {
        return new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function shouldTaskAppearToday(task) {
        const today = new Date();
        const dayOfWeek = today.getDay();
        const dayNames = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        const todayName = dayNames[dayOfWeek];
        
        // If task was completed today, don't show it again today
        if (task.lastCompleted) {
            const completedDate = new Date(task.lastCompleted);
            const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            const completedStart = new Date(completedDate.getFullYear(), completedDate.getMonth(), completedDate.getDate());
            
            if (completedStart.getTime() === todayStart.getTime()) {
                return false; // Completed today, don't show again
            }
        }
        
        if (task.frequencyData) {
            const data = task.frequencyData;
            if (data.frequency === 'never') return false;
            
            if (data.scheduling === 'completion' && task.lastCompleted) {
                const lastCompleted = new Date(task.lastCompleted);
                const daysSinceCompletion = Math.floor((today - lastCompleted) / (1000 * 60 * 60 * 24));
                
                let intervalDays = data.interval;
                if (data.unit === 'weeks') intervalDays *= 7;
                else if (data.unit === 'months') intervalDays *= 30;
                else if (data.unit === 'years') intervalDays *= 365;
                
                return daysSinceCompletion >= intervalDays;
            }
            
            if ((data.frequency === 'weekly' || data.unit === 'weeks') && data.daysOfWeek) {
                return data.daysOfWeek.includes(todayName);
            }
            
            if (data.frequency === 'daily' || data.unit === 'days') {
                return true;
            }
            
            return Math.random() > 0.7;
        }
        
        switch (task.type) {
            case 'never': return false;
            case 'daily': return true;
            case 'weekdays': return dayOfWeek >= 1 && dayOfWeek <= 5;
            case 'weekends': return dayOfWeek === 0 || dayOfWeek === 6;
            case 'monday': case 'tuesday': case 'wednesday': case 'thursday': case 'friday': case 'saturday': case 'sunday':
                return task.type === todayName;
            default: return Math.random() > 0.7;
        }
    }

    function generateDailyTasks() {
        const currentDay = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'][new Date().getDay()];
        const dailyTasks = {};
        
        for (const [category, categoryTasks] of Object.entries(tasks)) {
            dailyTasks[category] = [];
            const limit = rules[category][currentDay];
            
            if (limit === -1) {
                const availableTasks = categoryTasks.filter(task => shouldTaskAppearToday(task));
                dailyTasks[category] = availableTasks;
            } else if (limit > 0 && categoryTasks.length > 0) {
                const availableTasks = categoryTasks.filter(task => shouldTaskAppearToday(task));
                for (let i = 0; i < Math.min(limit, availableTasks.length); i++) {
                    const taskIndex = (rotationIndex[category] + i) % availableTasks.length;
                    if (availableTasks[taskIndex]) dailyTasks[category].push(availableTasks[taskIndex]);
                }
            }
        }
        return dailyTasks;
    }

        const category = document.getElementById('taskCategory').value;
        const frequency = document.getElementById('newTaskFrequency').value;
        
        if (!text) return;
        
        const newTask = {
            id: Date.now(),
            text: text,
            type: frequency
        };
        
        if (frequency !== 'never') {
            const frequencyData = {
                frequency: frequency,
                interval: parseInt(document.getElementById('newTaskInterval').value) || 1,
                unit: document.getElementById('newTaskUnit').value,
                scheduling: document.getElementById('newTaskScheduling').value
            };
            
            if (frequency === 'weekly' || frequencyData.unit === 'weeks') {
                const selectedDays = [];
                ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'].forEach(day => {
                    const checkbox = document.getElementById(`new_day_${day}`);
                    if (checkbox && checkbox.checked) selectedDays.push(day);
                });
                frequencyData.daysOfWeek = selectedDays.length > 0 ? selectedDays : ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'];
            }
            
            newTask.frequencyData = frequencyData;
            if (frequencyData.interval !== 1) {
                newTask.type = `every-${frequencyData.interval}-${frequencyData.unit}`;
            }
        }
        
        tasks[category].push(newTask);
        
        document.getElementById('newTaskInput').value = '';
        document.getElementById('newTaskFrequency').value = 'weekly';
        document.getElementById('newTaskInterval').value = 1;
        document.getElementById('newTaskUnit').value = 'weeks';
        document.getElementById('newTaskScheduling').value = 'fixed';
        
        ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'].forEach(day => {
            const checkbox = document.getElementById(`new_day_${day}`);
            if (checkbox) checkbox.checked = false;
        });
        
        updateNewTaskFrequencyOptions();
        renderTaskList();
        renderDailyView();
        saveDataToSupabase();
    }

    function deleteTask(category, taskId) {
        tasks[category] = tasks[category].filter(task => task.id !== taskId);
        renderTaskList();
        renderDailyView();
        saveDataToSupabase();
    }

    function completeTask(category, taskId, buttonElement) {
        const task = tasks[category].find(t => t.id === taskId);
        if (task) {
            task.lastCompleted = new Date().toISOString();
            saveDataToSupabase();
        }
        
        if (buttonElement) {
            buttonElement.textContent = '✓';
            buttonElement.style.background = '#28a745';
        }
        
        setTimeout(() => {
            renderDailyView();
        }, 1000);
    }

    function showView(viewName) {
        document.querySelectorAll('.view-section').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        if (viewName === 'daily') {
            document.getElementById('dailyView').style.display = 'block';
            event.target.classList.add('active');
            renderDailyView();
        } else if (viewName === 'setup') {
            document.getElementById('setupView').style.display = 'block';
            event.target.classList.add('active');
            updateCategoryDropdown();
            renderTaskList();
            renderLimitsSection();
            renderCategoryList();
        }
    }

    document.getElementById('currentDate').textContent = getCurrentDate();
    updateCategoryDropdown();
    renderDailyView();
    renderCategoryList();
    document.getElementById('newTaskInput').addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });
</script>
